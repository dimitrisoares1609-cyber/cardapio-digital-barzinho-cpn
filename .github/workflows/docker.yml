name: Imagens Docker

# A cada push na main, monta as imagens da API e do front e publica no GitHub Container Registry.
# Na VPS, basta clicar em "Atualizar" no Gerenciador Docker da Hostinger para baixar a versão nova.
on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/dimitrisoares1609-cyber/barcpn-${{ matrix.name }}:latest
            ghcr.io/dimitrisoares1609-cyber/barcpn-${{ matrix.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

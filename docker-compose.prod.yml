# Produção (VPS): sobe com  ./deploy/deploy.sh
#
#   caddy  → HTTPS automático (Let's Encrypt) nas portas 80/443, repassa tudo para o "web"
#   web    → nginx com o front React + proxy da API/WebSocket
#   api    → API REST + Socket.IO; imagens enviadas ficam no volume "uploads"
#   db     → PostgreSQL (sem porta exposta para a internet)
#
# As senhas e segredos ficam no arquivo .env (gerado pelo deploy.sh, fora do Git).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: cardapio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cardapio"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      PUBLIC_URL: https://${PRIMARY_DOMAIN:?defina no .env}
      MEDIA_BASE_URL: ""
      CORS_ORIGINS: https://${PRIMARY_DOMAIN}
      TRUST_PROXY: 2
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/cardapio
      JWT_SECRET: ${JWT_SECRET:?defina no .env}
      JWT_EXPIRES_IN: 12h
      ADMIN_NAME: Administrador
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@barzinhocpn.com.br}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina no .env}
      STORAGE_DRIVER: local
    volumes:
      - uploads:/app/uploads

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESSES: ${SITE_ADDRESSES:?defina no .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

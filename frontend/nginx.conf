# Serve o front (SPA) e repassa a API, o WebSocket e as imagens para o container "api"
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:3333;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 6m;
  }

  location /socket.io/ {
    proxy_pass http://api:3333;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ~ ^/(seed-images|uploads)/ {
    proxy_pass http://api:3333;
  }

  # Qualquer outra rota é do React Router (ex.: /carrinho, /admin)
  location / {
    try_files $uri /index.html;
  }

  # Service worker e manifest do app instalável: sempre a versão mais nova
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}

# Serve o front (SPA) e repassa a API, o WebSocket e as imagens para o container "api"
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Vale para as rotas sem add_header próprio; as que têm repetem o include
  include /etc/nginx/security-headers.conf;

  location /api/ {
    proxy_pass http://api:3333;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 6m;
  }

  location /socket.io/ {
    proxy_pass http://api:3333;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ~ ^/(seed-images|uploads)/ {
    proxy_pass http://api:3333;
  }

  # Rotas do React Router: entregam o app com status 200
  location = / {
    try_files /index.html =404;
  }
  location ~ ^/(carrinho|meus-pedidos|pedido/[A-Za-z0-9-]+|admin(/[a-z-]*)?)/?$ {
    try_files /index.html =404;
  }

  # Arquivos reais (ícones, robots.txt...). O que não existir responde 404 de verdade,
  # mostrando a tela "Página não encontrada" do próprio app.
  location / {
    try_files $uri =404;
  }
  error_page 404 /index.html;

  # Service worker e manifest do app instalável: sempre a versão mais nova
  location = /sw.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    expires 30d;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, immutable";
  }
}
